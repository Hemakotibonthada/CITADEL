[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "citadel"
version = "1.0.0"
description = "CITADEL — Enterprise Local-First Multi-Agent Algorithmic Trading System"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Citadel Team" }]
keywords = ["trading", "algorithmic", "multi-agent", "llm", "quantitative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    # Async & Networking
    "uvloop>=0.19.0;platform_system!='Windows'",
    "websockets>=12.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    # Data & Storage
    "lancedb>=0.4.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "orjson>=3.9.0",
    # ML & AI
    "scikit-learn>=1.3.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.3.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    # Trading
    "ta-lib>=0.4.28;platform_system!='Windows'",
    "pandas-ta>=0.3.14b1",
    # Visualization & Reporting
    "plotly>=5.18.0",
    "reportlab>=4.0.0",
    "weasyprint>=60.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.8.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # Testing
    "hypothesis>=6.92.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    # Logging & Monitoring
    "structlog>=23.2.0",
    "psutil>=5.9.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
intel = ["openvino>=2024.0", "openvino-genai>=2024.0", "optimum[openvino]>=1.16.0"]
apple = ["mlx>=0.5.0", "mlx-lm>=0.5.0"]
dev = [
    "ruff>=0.1.11",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "coverage>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
citadel = "src.main:main"
citadel-backtest = "src.engine.backtest:run_backtest_cli"
citadel-report = "src.api.report_generator:generate_cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "ICN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "hardware: marks tests requiring specific hardware",
]
