# ============================================================
#  CITADEL — Strategy Configuration
# ============================================================

strategies:
  # ── Mean Reversion ─────────────────────────────────────
  mean_reversion:
    enabled: true
    universe: ["SPY", "QQQ", "IWM"]
    timeframe: "15m"
    lookback_periods: 20
    entry_z_score: -2.0
    exit_z_score: 0.0
    stop_loss_z_score: -3.5
    max_hold_bars: 40
    weight: 0.3

  # ── Momentum ───────────────────────────────────────────
  momentum:
    enabled: true
    universe: ["AAPL", "MSFT", "GOOGL", "AMZN", "NVDA", "TSLA", "META"]
    timeframe: "1h"
    fast_period: 12
    slow_period: 26
    signal_period: 9
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30
    adx_threshold: 25
    weight: 0.35

  # ── Statistical Arbitrage ──────────────────────────────
  stat_arb:
    enabled: true
    pairs:
      - ["AAPL", "MSFT"]
      - ["GOOGL", "META"]
      - ["SPY", "QQQ"]
    timeframe: "5m"
    cointegration_lookback: 252
    z_score_entry: 2.0
    z_score_exit: 0.5
    hedge_ratio_method: "kalman"   # ols | kalman | johansen
    weight: 0.2

  # ── LLM-Guided (Agent-Driven) ──────────────────────────
  llm_guided:
    enabled: true
    universe: ["AAPL", "MSFT", "GOOGL", "AMZN", "NVDA"]
    timeframe: "1h"
    min_confidence: 0.7
    max_positions: 3
    news_weight: 0.4
    technical_weight: 0.35
    macro_weight: 0.25
    weight: 0.15

  # ── Portfolio-Level Settings ───────────────────────────
  portfolio:
    rebalance_frequency: "1h"
    max_total_positions: 15
    min_cash_reserve_pct: 10.0
    correlation_max: 0.7

backtest:
  start_date: "2024-01-01"
  end_date: "2025-12-31"
  initial_capital: 100000.0
  commission_per_trade: 0.0
  slippage_bps: 2.0
  margin_rate: 0.05
  benchmark: "SPY"
  warmup_bars: 50
