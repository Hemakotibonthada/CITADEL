# CITADEL CI/CD Pipeline

name: CITADEL CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: citadel
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        working-directory: citadel
        run: |
          pip install ruff
          ruff check src/ tests/

      - name: Run type checking
        working-directory: citadel
        run: |
          pip install mypy
          mypy src/ --ignore-missing-imports

      - name: Run tests
        working-directory: citadel
        run: |
          pytest tests/ -v --tb=short -x

      - name: Run property-based tests
        working-directory: citadel
        run: |
          pytest tests/ -v --tb=short -k "hypothesis" --hypothesis-seed=42

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install UI dependencies
        working-directory: citadel/src-ui
        run: npm install

      - name: Build UI
        working-directory: citadel/src-ui
        run: npm run build

  integration:
    needs: [test, build-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: citadel
        run: |
          pip install -e ".[dev]"

      - name: Run integration tests
        working-directory: citadel
        run: |
          pytest tests/ -v -m integration --tb=short
